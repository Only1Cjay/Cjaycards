<!DOCTYPE html>
<html lang="en" data-family="slate" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212A33">
<meta name="description" content="CjayCards — spaced repetition flashcards. Create decks, study daily, master over time.">
<title>CjayCards — Spaced Repetition</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
  (function(){
    try {
      var fam = localStorage.getItem('cjaycards.family') || 'slate';
      var mode = localStorage.getItem('cjaycards.mode') || 'light';
      document.documentElement.setAttribute('data-family', fam);
      document.documentElement.setAttribute('data-mode', mode);
    } catch(e){}
  })();
</script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner" role="status" aria-live="polite">
  <i class="fa-solid fa-wifi"></i>
  <span>You're offline — changes will still save locally</span>
</div>

<header class="app-header">
  <div class="header-left">
    <img class="header-logo" src="icon.svg" alt="" aria-hidden="true">
    <h1 class="app-title"><span class="title-cjay">Cjay</span><span class="title-cards">Cards</span></h1>
  </div>
  <div class="header-right">
    <button class="due-chip" id="dueChip" aria-label="Cards due now" title="Cards due now">
      <i class="fa-solid fa-bolt"></i>
      <span id="dueChipCount">0</span>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <button class="icon-btn has-badge" id="menuBtn" aria-label="Open menu" title="Menu" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
      <span class="icon-badge" id="menuBadge" hidden></span>
    </button>
  </div>
</header>

<nav class="menu-dropdown" id="menuDropdown" hidden aria-label="Main menu">
  <button class="menu-item" data-action="search"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button>
  <button class="menu-item" data-action="tags"><i class="fa-solid fa-tag"></i><span>Tags</span></button>
  <button class="menu-item" data-action="activity"><i class="fa-solid fa-chart-line"></i><span>Activity</span></button>
  <button class="menu-item" data-action="settings"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
  <div class="menu-divider"></div>
  <button class="menu-item" data-action="tools"><i class="fa-solid fa-toolbox"></i><span>Tools</span></button>
</nav>
<div class="menu-backdrop" id="menuBackdrop" hidden></div>

<div class="tab-bar" role="tablist">
  <button class="tab active" data-tab="decks" role="tab" aria-selected="true">Decks</button>
  <button class="tab" data-tab="due" role="tab" aria-selected="false">Due</button>
</div>

<main class="app-main">
  <section id="screen-decks" class="screen active"></section>
  <section id="screen-due" class="screen"></section>
</main>

<div class="fab-wrap">
  <div class="fab-menu" id="fabMenu" hidden>
    <button class="fab-item" data-action="add-card"><i class="fa-solid fa-plus"></i><span>Add Card</span></button>
    <button class="fab-item" data-action="new-deck"><i class="fa-solid fa-layer-group"></i><span>New Deck</span></button>
  </div>
  <button class="fab" id="fabBtn" aria-label="Create" aria-expanded="false">
    <i class="fa-solid fa-plus"></i>
  </button>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<div class="view-root" id="viewRoot" hidden></div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-slot" id="modalSlot"></div>
</div>

<div class="install-banner" id="installBanner" hidden>
  <i class="fa-solid fa-circle-down"></i>
  <div class="install-text">
    <strong>Install CjayCards</strong>
    <span>Add to your home screen for quick access</span>
  </div>
  <button class="install-btn" id="installAccept">Install</button>
  <button class="install-dismiss" id="installDismiss" aria-label="Dismiss"><i class="fa-solid fa-xmark"></i></button>
</div>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
