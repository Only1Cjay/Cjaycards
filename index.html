<script>
// ============================================================
// GOOGLE DRIVE SYNC
// ============================================================
function saveGoogleClientId() {
    const clientId = document.getElementById('googleClientId').value.trim();
    if (clientId) {
        localStorage.setItem(CLIENT_ID_KEY, clientId);
        showToast('Client ID saved!');
    }
}

function loadGoogleClientId() {
    return localStorage.getItem(CLIENT_ID_KEY) || '';
}

function saveGoogleToken(token) {
    localStorage.setItem(TOKEN_KEY, token);
}

function loadGoogleToken() {
    return localStorage.getItem(TOKEN_KEY) || '';
}

function setDriveStatus(msg, type) {
    const el = document.getElementById('driveStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'drive-status ' + (type || '');
}

function updateDriveButtons(connected) {
    document.getElementById('pushDriveBtn').disabled = !connected;
    document.getElementById('pullDriveBtn').disabled = !connected;
    if (connected) {
        document.getElementById('connectDriveBtn').textContent = '✅ Connected';
        document.getElementById('connectDriveBtn').className = 'btn btn-success btn-sm';
    } else {
        document.getElementById('connectDriveBtn').textContent = '🔗 Connect Google Drive';
        document.getElementById('connectDriveBtn').className = 'btn btn-primary btn-sm';
    }
}

function connectGoogleDrive() {
    const clientId = document.getElementById('googleClientId').value.trim() || loadGoogleClientId();
    if (!clientId) {
        showToast('Please enter your Google Client ID first.');
        return;
    }
    localStorage.setItem(CLIENT_ID_KEY, clientId);
    
    // Load Google Identity Services library
    if (typeof google === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://accounts.google.com/gsi/client';
        script.onload = initGoogleDrive;
        document.head.appendChild(script);
    } else {
        initGoogleDrive();
    }
}

function initGoogleDrive() {
    const clientId = loadGoogleClientId();
    if (!clientId) return;
    
    try {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (tokenResponse) => {
                if (tokenResponse.access_token) {
                    saveGoogleToken(tokenResponse.access_token);
                    setDriveStatus('✅ Connected to Google Drive', 'connected');
                    updateDriveButtons(true);
                    showToast('Google Drive connected!');
                } else {
                    setDriveStatus('❌ Connection failed: ' + (tokenResponse.error || 'Unknown error'), 'disconnected');
                    updateDriveButtons(false);
                }
            },
        });
        
        // Request token
        tokenClient.requestAccessToken();
    } catch (err) {
        console.error('Google init error:', err);
        setDriveStatus('❌ Error: ' + err.message, 'disconnected');
        updateDriveButtons(false);
    }
}

async function pushToDrive() {
    const token = loadGoogleToken();
    if (!token) {
        showToast('Please connect to Google Drive first.');
        return;
    }
    
    const cardCount = Object.keys(data.decks).reduce((acc, id) => acc + data.decks[id].cards.length, 0);
    if (cardCount === 0) {
        showToast('No data to push. Add some cards first!');
        return;
    }
    
    setDriveStatus('📤 Pushing to Drive...', 'pending');
    
    const backupData = {
        data: data,
        labels: labels,
        theme: getStoredTheme(),
        exportedAt: new Date().toISOString()
    };
    
    const jsonString = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const metadata = {
        name: 'cjaycards_backup.json',
        parents: ['root']
    };
    
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    
    try {
        const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
            },
            body: form
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                // Token expired, reconnect
                saveGoogleToken('');
                updateDriveButtons(false);
                setDriveStatus('❌ Token expired. Please reconnect.', 'disconnected');
                showToast('Token expired. Please reconnect.');
                return;
            }
            throw new Error('Upload failed (HTTP ' + response.status + ')');
        }
        
        const result = await response.json();
        setDriveStatus('✅ Push successful! File ID: ' + result.id, 'connected');
        showToast('Data pushed to Drive!');
        
    } catch (err) {
        console.error('Push error:', err);
        setDriveStatus('❌ Push failed: ' + err.message, 'disconnected');
        showToast('Push failed: ' + err.message);
    }
}

async function pullFromDrive() {
    const token = loadGoogleToken();
    if (!token) {
        showToast('Please connect to Google Drive first.');
        return;
    }
    
    setDriveStatus('📥 Pulling from Drive...', 'pending');
    
    try {
        // Search for the backup file
        const searchResponse = await fetch(
            "https://www.googleapis.com/drive/v3/files?q=name='cjaycards_backup.json' and trashed=false&orderBy=modifiedTime desc&pageSize=1",
            {
                headers: {
                    'Authorization': 'Bearer ' + token,
                }
            }
        );
        
        if (!searchResponse.ok) {
            if (searchResponse.status === 401) {
                saveGoogleToken('');
                updateDriveButtons(false);
                setDriveStatus('❌ Token expired. Please reconnect.', 'disconnected');
                showToast('Token expired. Please reconnect.');
                return;
            }
            throw new Error('Search failed (HTTP ' + searchResponse.status + ')');
        }
        
        const searchResult = await searchResponse.json();
        
        if (!searchResult.files || searchResult.files.length === 0) {
            setDriveStatus('ℹ️ No backup found in Drive. Push data first.', '');
            showToast('No backup found in Drive.');
            return;
        }
        
        const fileId = searchResult.files[0].id;
        const fileModified = searchResult.files[0].modifiedTime;
        
        // Download the file
        const downloadResponse = await fetch(
            `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
            {
                headers: {
                    'Authorization': 'Bearer ' + token,
                }
            }
        );
        
        if (!downloadResponse.ok) {
            throw new Error('Download failed (HTTP ' + downloadResponse.status + ')');
        }
        
        const jsonString = await downloadResponse.text();
        const backupData = JSON.parse(jsonString);
        
        if (!backupData.data || !backupData.data.decks) {
            throw new Error('Invalid backup data format.');
        }
        
        let cardCount = 0;
        for (const [id, deck] of Object.entries(backupData.data.decks)) {
            cardCount += deck.cards ? deck.cards.length : 0;
        }
        
        if (!confirm(`Replace all current data with Drive backup?\n\nBackup contains:\n• ${Object.keys(backupData.data.decks).length} deck(s)\n• ${cardCount} cards\n• Last modified: ${new Date(fileModified).toLocaleString()}\n\nContinue?`)) {
            setDriveStatus('Pull cancelled.', '');
            return;
        }
        
        data = backupData.data;
        if (backupData.labels) {
            labels = backupData.labels;
            saveLabels();
            document.getElementById('labelAgain').value = labels.again || 'Again';
            document.getElementById('labelHard').value = labels.hard || 'Hard';
            document.getElementById('labelGood').value = labels.good || 'Good';
            document.getElementById('labelEasy').value = labels.easy || 'Easy';
        }
        if (backupData.theme) applyTheme(backupData.theme);
        
        saveData();
        renderHome();
        renderSettings();
        setDriveStatus('✅ Pull successful! Imported ' + cardCount + ' cards from Drive.', 'connected');
        showToast('✅ Imported ' + cardCount + ' cards from Drive!');
        
    } catch (err) {
        console.error('Pull error:', err);
        setDriveStatus('❌ Pull failed: ' + err.message, 'disconnected');
        showToast('Pull failed: ' + err.message);
    }
}

// ============================================================
// BACKUP SYSTEM
// ============================================================
function exportBackup() {
    closeFab();
    const backupData = {
        version: '1.0',
        exportedAt: new Date().toISOString(),
        data: data,
        labels: labels,
        theme: getStoredTheme()
    };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cjaycards_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup exported!');
}

function importBackup() {
    closeFab();
    document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        try {
            const backupData = JSON.parse(event.target.result);
            if (!backupData.data || !backupData.data.decks) {
                showToast('Invalid backup file!');
                return;
            }
            let cardCount = 0;
            for (const [id, deck] of Object.entries(backupData.data.decks)) {
                cardCount += deck.cards ? deck.cards.length : 0;
            }
            if (!confirm(`Replace all current data with backup?\n\nBackup contains:\n• ${Object.keys(backupData.data.decks).length} deck(s)\n• ${cardCount} card(s)\n\nContinue?`)) return;
            data = backupData.data;
            if (backupData.labels) {
                labels = backupData.labels;
                saveLabels();
                document.getElementById('labelAgain').value = labels.again || 'Again';
                document.getElementById('labelHard').value = labels.hard || 'Hard';
                document.getElementById('labelGood').value = labels.good || 'Good';
                document.getElementById('labelEasy').value = labels.easy || 'Easy';
            }
            if (backupData.theme) applyTheme(backupData.theme);
            saveData();
            renderHome();
            renderSettings();
            showToast(`✅ Restored ${cardCount} cards from backup!`);
        } catch (err) {
            showToast('❌ Error: Invalid backup file');
            console.error(err);
        }
    };
    reader.readAsText(file);
    this.value = '';
});

// ============================================================
// MODAL SYSTEM
// ============================================================
function openModal(type, deckId, cardId) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    
    if (type === 'newDeck') {
        content.innerHTML = `
            <h2>New Deck</h2>
            <p class="sub">Create a new deck for a subject or topic.</p>
            <label>Deck Name</label>
            <input id="modalDeckName" placeholder="e.g. Anatomy, History, French" autofocus>
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmNewDeck()">Create</button>
            </div>
        `;
        overlay.classList.add('active');
        setTimeout(() => document.getElementById('modalDeckName')?.focus(), 100);
        return;
    }
    
    if (type === 'addCard') {
        if (!deckId || !data.decks[deckId]) {
            const ids = Object.keys(data.decks);
            if (ids.length === 0) {
                showToast('Please create a deck first.');
                return;
            }
            deckId = ids[0];
            selectedDeckId = deckId;
        }
        const deck = data.decks[deckId];
        content.innerHTML = `
            <h2>Add Card</h2>
            <p class="sub">To: <strong style="color:var(--text-primary);">${deck.name}</strong></p>
            <label>Front (Question)</label>
            <textarea id="modalFront" placeholder="What is the capital of France?"></textarea>
            <label>Back (Answer)</label>
            <textarea id="modalBack" placeholder="Paris"></textarea>
            <label>Tags (comma-separated)</label>
            <input id="modalTags" placeholder="e.g. geography, exam, weak">
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmAddCard('${deckId}')">Add Card</button>
            </div>
        `;
        overlay.classList.add('active');
        setTimeout(() => document.getElementById('modalFront')?.focus(), 100);
        return;
    }
    
    if (type === 'editCard') {
        if (!deckId || !data.decks[deckId]) return;
        const deck = data.decks[deckId];
        const card = deck.cards.find(c => c.id === cardId);
        if (!card) return;
        content.innerHTML = `
            <h2>Edit Card</h2>
            <p class="sub">In: <strong style="color:var(--text-primary);">${deck.name}</strong></p>
            <label>Front (Question)</label>
            <textarea id="modalFront">${card.front}</textarea>
            <label>Back (Answer)</label>
            <textarea id="modalBack">${card.back}</textarea>
            <label>Tags (comma-separated)</label>
            <input id="modalTags" value="${card.tags ? card.tags.join(', ') : ''}">
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmEditCard('${deckId}','${cardId}')">Save</button>
            </div>
        `;
        overlay.classList.add('active');
        setTimeout(() => document.getElementById('modalFront')?.focus(), 100);
        return;
    }
    
    if (type === 'manageDeck') {
        if (!deckId || !data.decks[deckId]) {
            showToast('Deck not found.');
            return;
        }
        const deck = data.decks[deckId];
        let cardHtml = '';
        if (deck.cards.length === 0) {
            cardHtml = '<p class="text-muted" style="padding:12px 0;">No cards yet.</p>';
        } else {
            cardHtml = deck.cards.map((c, i) => `
                <div class="card-list-item">
                    <div style="flex:1; min-width:0;">
                        <div style="font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.front}</div>
                        ${c.tags && c.tags.length > 0 ? `<div class="card-tags-sm"><span>${c.tags.join('</span><span>')}</span></div>` : ''}
                    </div>
                    <div style="display:flex; gap:6px; flex-shrink:0;">
                        <span class="del" onclick="openModal('editCard','${deckId}','${c.id}')" style="background:var(--accent);color:#fff;">✎</span>
                        <span class="del" onclick="deleteCard('${deckId}','${c.id}')">✕</span>
                    </div>
                </div>
            `).join('');
        }
        content.innerHTML = `
            <h2>${deck.name}</h2>
            <p class="sub">${deck.cards.length} cards total</p>
            <div class="card-list-modal">${cardHtml}</div>
            <div class="btn-row" style="flex-wrap:wrap;">
                <button class="btn btn-neutral" style="flex:1;" onclick="closeModal();openModal('addCard','${deckId}')">+ Add Card</button>
                <button class="btn btn-neutral" style="flex:1;" onclick="closeModal();renameDeck('${deckId}')">Rename</button>
                <button class="btn btn-danger" style="flex:1;" onclick="closeModal();deleteDeck('${deckId}')">Delete</button>
                <button class="btn btn-neutral" style="flex:1;" onclick="closeModal()">Done</button>
            </div>
        `;
        overlay.classList.add('active');
        return;
    }
    
    if (type === 'search') {
        content.innerHTML = `
            <h2>Search Cards</h2>
            <p class="sub">Search by front, back, or tags (use #tagname)</p>
            <input id="searchInput" placeholder="Type to search..." oninput="liveSearch()" autofocus>
            <div id="searchResults" style="margin-top:12px; max-height:300px; overflow-y:auto;"></div>
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Close</button>
            </div>
        `;
        overlay.classList.add('active');
        setTimeout(() => document.getElementById('searchInput')?.focus(), 100);
        return;
    }
    
    if (type === 'tagsOverview') {
        const tagCounts = {};
        for (const [deckId, deck] of Object.entries(data.decks)) {
            deck.cards.forEach(c => {
                if (c.tags) {
                    c.tags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                }
            });
        }
        const sorted = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
        let html = sorted.length === 0 ? '<p class="text-muted">No tags found.</p>' : 
            sorted.map(([tag, count]) => `
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-color);">
                    <span style="color:var(--text-primary);">#${tag}</span>
                    <span class="text-muted">${count} card${count > 1 ? 's' : ''}</span>
                </div>
            `).join('');
        content.innerHTML = `
            <h2>Tags Overview</h2>
            <p class="sub">All tags across all decks</p>
            <div style="max-height:300px; overflow-y:auto;">${html}</div>
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Close</button>
            </div>
        `;
        overlay.classList.add('active');
        return;
    }
    
    if (type === 'resetProgress') {
        const deckOptions = Object.entries(data.decks).map(([id, d]) => 
            `<option value="${id}">${d.name}</option>`
        ).join('');
        content.innerHTML = `
            <h2>Reset Progress</h2>
            <p class="sub">Reset all due dates to today for a deck.</p>
            <label>Select Deck</label>
            <select id="resetDeckSelect">
                ${deckOptions}
            </select>
            <div class="btn-row">
                <button class="btn btn-neutral" onclick="closeModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmResetProgress()">Reset</button>
            </div>
        `;
        overlay.classList.add('active');
        return;
    }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

function confirmNewDeck() {
    const nameInput = document.getElementById('modalDeckName');
    if (!nameInput) {
        showToast('Error: Could not find input field.');
        return;
    }
    const deckName = nameInput.value.trim();
    if (!deckName) {
        showToast('Please enter a deck name.');
        return;
    }
    const id = generateId();
    data.decks[id] = { 
        name: deckName, 
        intervals: [0.0417, 1, 3, 7], 
        cards: [] 
    };
    saveData();
    closeModal();
    renderHome();
    showToast('✅ Deck created: ' + deckName);
}

function confirmAddCard(deckId) {
    const front = document.getElementById('modalFront').value.trim();
    const back = document.getElementById('modalBack').value.trim();
    if (!front || !back) return;
    const tagsRaw = document.getElementById('modalTags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(t => t) : [];
    data.decks[deckId].cards.push({
        id: generateId(),
        front, back,
        tags: tags,
        dueDate: today(),
        step: 0,
        ease: 2.5
    });
    saveData();
    closeModal();
    renderHome();
    showToast('Card added!');
}

function confirmEditCard(deckId, cardId) {
    const front = document.getElementById('modalFront').value.trim();
    const back = document.getElementById('modalBack').value.trim();
    if (!front || !back) return;
    const tagsRaw = document.getElementById('modalTags').value.trim();
    const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(t => t) : [];
    const card = data.decks[deckId].cards.find(c => c.id === cardId);
    if (card) {
        card.front = front;
        card.back = back;
        card.tags = tags;
        saveData();
        closeModal();
        renderHome();
        showToast('Card updated!');
    }
}

function deleteCard(deckId, cardId) {
    if (!confirm('Delete this card?')) return;
    data.decks[deckId].cards = data.decks[deckId].cards.filter(c => c.id !== cardId);
    saveData();
    openModal('manageDeck', deckId);
    renderHome();
}

function renameDeck(deckId) {
    const newName = prompt('New deck name:', data.decks[deckId].name);
    if (newName && newName.trim()) {
        data.decks[deckId].name = newName.trim();
        saveData();
        renderHome();
    }
}

function deleteDeck(id) {
    if (!confirm(`Delete "${data.decks[id].name}" and all its cards?`)) return;
    delete data.decks[id];
    saveData();
    renderHome();
    renderSettings();
}

// ============================================================
// SEARCH
// ============================================================
function openSearch() {
    closeFab();
    openModal('search');
    setTimeout(() => {
        const input = document.getElementById('searchInput');
        if (input) {
            input.addEventListener('input', liveSearch);
            liveSearch();
        }
    }, 100);
}

function liveSearch() {
    const input = document.getElementById('searchInput');
    const results = document.getElementById('searchResults');
    if (!input || !results) return;
    const query = input.value.toLowerCase().trim();
    if (!query) {
        results.innerHTML = '<p class="text-muted">Type to search...</p>';
        return;
    }
    
    const isTagSearch = query.startsWith('#');
    const searchTerm = isTagSearch ? query.slice(1) : query;
    
    let matches = [];
    for (const [deckId, deck] of Object.entries(data.decks)) {
        deck.cards.forEach(c => {
            let match = false;
            if (isTagSearch) {
                if (c.tags && c.tags.some(t => t.toLowerCase().includes(searchTerm))) match = true;
            } else {
                if (c.front.toLowerCase().includes(searchTerm) || 
                    c.back.toLowerCase().includes(searchTerm) ||
                    (c.tags && c.tags.some(t => t.toLowerCase().includes(searchTerm)))) match = true;
            }
            if (match) matches.push({ ...c, deckName: deck.name, deckId });
        });
    }
    
    if (matches.length === 0) {
        results.innerHTML = '<p class="text-muted">No matches found.</p>';
        return;
    }
    
    results.innerHTML = matches.map(m => `
        <div class="search-result-item">
            <div>
                <div style="font-weight:500;">${m.front}</div>
                <div class="deck-name">${m.deckName}</div>
                ${m.tags && m.tags.length > 0 ? `<div class="tags-sm"><span>${m.tags.join('</span><span>')}</span></div>` : ''}
            </div>
            <button class="btn btn-sm btn-neutral" onclick="closeModal();startStudy('${m.deckId}')">Study</button>
        </div>
    `).join('');
}

// ============================================================
// TAGS OVERVIEW
// ============================================================
function openTagsOverview() {
    closeFab();
    openModal('tagsOverview');
}

// ============================================================
// RENDER: HOME
// ============================================================
function renderHome() {
    const container = document.getElementById('deckList');
    const ids = Object.keys(data.decks);
    if (ids.length === 0) {
        container.innerHTML = `<div class="empty-state"><div style="font-size:48px; margin-bottom:12px; opacity:0.3;">📚</div><p>No decks yet. Tap "+ New Deck"</p></div>`;
        return;
    }
    container.innerHTML = ids.map(id => {
        const deck = data.decks[id];
        const due = deck.cards.filter(c => isDue(c)).length;
        return `
            <div class="deck-card">
                <div class="info">
                    <h3>${deck.name}</h3>
                    <p>${due} due · ${deck.cards.length} total</p>
                </div>
                <div class="actions">
                    <button class="btn btn-primary btn-sm" onclick="selectedDeckId='${id}';startStudy('${id}')">Study</button>
                    <button class="btn btn-neutral btn-sm" onclick="selectedDeckId='${id}';openModal('manageDeck','${id}')">Edit</button>
                </div>
            </div>
        `;
    }).join('');
    updateBadge();
}

function updateBadge() {
    let total = 0;
    for (const id of Object.keys(data.decks)) {
        total += data.decks[id].cards.filter(c => isDue(c)).length;
    }
    document.getElementById('dueBadge').textContent = total + ' due';
}

// ============================================================
// STUDY ENGINE
// ============================================================
function startStudy(deckId) {
    currentDeckId = deckId;
    const deck = data.decks[deckId];
    const due = deck.cards.filter(c => isDue(c));
    if (due.length === 0) {
        showToast('No cards due in this deck!');
        return;
    }
    studyQueue = due.sort(() => Math.random() - 0.5);
    currentCardIndex = 0;
    isFlipped = false;
    document.getElementById('studyDeckName').textContent = deck.name;
    showScreen('study');
    renderCard();
}

function renderCard() {
    const container = document.getElementById('cardContainer');
    const front = document.getElementById('cardFront');
    const back = document.getElementById('cardBack');
    const tags = document.getElementById('cardTags');
    const counter = document.getElementById('cardCounter');
    const btns = document.getElementById('intervalBtns');
    const complete = document.getElementById('studyComplete');
    const actions = document.getElementById('studyActions');
    const revealBtn = document.querySelector('#studyActions .btn-neutral');
    
    if (currentCardIndex >= studyQueue.length) {
        container.style.display = 'none';
        actions.classList.add('hidden');
        complete.classList.remove('hidden');
        return;
    }
    container.style.display = 'flex';
    actions.classList.remove('hidden');
    complete.classList.add('hidden');
    btns.classList.add('hidden');
    revealBtn.classList.remove('hidden');
    
    const card = studyQueue[currentCardIndex];
    front.textContent = card.front;
    back.textContent = card.back;
    back.classList.remove('show');
    
    if (card.tags && card.tags.length > 0) {
        tags.innerHTML = card.tags.map(t => `<span>${t}</span>`).join('');
        tags.style.display = 'flex';
    } else {
        tags.style.display = 'none';
    }
    
    counter.textContent = `${currentCardIndex+1} / ${studyQueue.length}`;
    isFlipped = false;
    updateIntervalButtons();
}

function updateIntervalButtons() {
    const container = document.getElementById('intervalBtns');
    const deck = data.decks[currentDeckId];
    const intervals = deck.intervals;
    const labelKeys = ['again', 'hard', 'good', 'easy'];
    
    container.innerHTML = labelKeys.map((key, i) => {
        const label = labels[key] || key.charAt(0).toUpperCase() + key.slice(1);
        const display = getIntervalDisplay(intervals[i]);
        return `<button class="btn" onclick="answerCard(${i})">${label} (${display})</button>`;
    }).join('');
    
    container.classList.remove('hidden');
}

function flipCard() {
    if (isFlipped) return;
    isFlipped = true;
    document.getElementById('cardBack').classList.add('show');
    document.querySelector('#studyActions .btn-neutral').classList.add('hidden');
    document.getElementById('intervalBtns').classList.remove('hidden');
}

function answerCard(choice) {
    if (!isFlipped) return;
    const card = studyQueue[currentCardIndex];
    const deck = data.decks[currentDeckId];
    const interval = deck.intervals[choice] || 1;
    card.dueDate = daysFromNow(interval);
    const original = deck.cards.find(c => c.id === card.id);
    if (original) original.dueDate = card.dueDate;
    saveData();
    currentCardIndex++;
    renderCard();
}

function skipCard() {
    const card = studyQueue.splice(currentCardIndex, 1)[0];
    studyQueue.push(card);
    renderCard();
}

function exitStudy() {
    currentDeckId = null;
    studyQueue = [];
    currentCardIndex = 0;
    showScreen('home');
    renderHome();
}

// ============================================================
// SETTINGS
// ============================================================
function renderSettings() {
    const container = document.getElementById('settingsList');
    const ids = Object.keys(data.decks);
    if (ids.length === 0) {
        container.innerHTML = '<p class="text-muted">No decks yet. Create one first.</p>';
        return;
    }
    container.innerHTML = ids.map(id => {
        const deck = data.decks[id];
        const ints = deck.intervals;
        return `
            <div class="settings-group">
                <h3 style="color:var(--text-primary); margin-bottom:4px;">${deck.name}</h3>
                <div class="settings-row">
                    <div><label>Again</label><input type="number" step="0.01" value="${ints[0]}" data-deck="${id}" data-idx="0" class="interval-input"></div>
                    <div><label>Hard</label><input type="number" step="0.01" value="${ints[1]}" data-deck="${id}" data-idx="1" class="interval-input"></div>
                    <div><label>Good</label><input type="number" step="0.01" value="${ints[2]}" data-deck="${id}" data-idx="2" class="interval-input"></div>
                    <div><label>Easy</label><input type="number" step="0.01" value="${ints[3]}" data-deck="${id}" data-idx="3" class="interval-input"></div>
                </div>
            </div>
        `;
    }).join('');
    document.querySelectorAll('.interval-input').forEach(inp => {
        inp.addEventListener('change', function() {
            const deckId = this.dataset.deck;
            const idx = parseInt(this.dataset.idx);
            data.decks[deckId].intervals[idx] = parseFloat(this.value) || 0.01;
            saveData();
        });
    });
    
    const saved = loadLabels();
    document.getElementById('labelAgain').value = saved.again || 'Again';
    document.getElementById('labelHard').value = saved.hard || 'Hard';
    document.getElementById('labelGood').value = saved.good || 'Good';
    document.getElementById('labelEasy').value = saved.easy || 'Easy';
    
    // Load Google Client ID
    const clientId = loadGoogleClientId();
    if (clientId) {
        document.getElementById('googleClientId').value = clientId;
    }
    
    // Check if token exists
    const token = loadGoogleToken();
    if (token) {
        updateDriveButtons(true);
        setDriveStatus('✅ Connected to Google Drive', 'connected');
    } else {
        updateDriveButtons(false);
        setDriveStatus('ℹ️ Not connected. Click "Connect Google Drive".', '');
    }
}

function saveButtonLabels() {
    labels.again = document.getElementById('labelAgain').value.trim() || 'Again';
    labels.hard = document.getElementById('labelHard').value.trim() || 'Hard';
    labels.good = document.getElementById('labelGood').value.trim() || 'Good';
    labels.easy = document.getElementById('labelEasy').value.trim() || 'Easy';
    saveLabels();
    showToast('Labels saved!');
}

// ============================================================
// CSV IMPORT/EXPORT
// ============================================================
function importCSV() {
    closeFab();
    document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const text = event.target.result;
        const lines = text.split('\n').filter(line => line.trim());
        if (lines.length < 2) {
            showToast('CSV must have headers + data.');
            return;
        }
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const frontIdx = headers.indexOf('front');
        const backIdx = headers.indexOf('back');
        const tagsIdx = headers.indexOf('tags');
        const deckIdx = headers.indexOf('deck');
        
        if (frontIdx === -1 || backIdx === -1) {
            showToast('CSV must have "front" and "back" columns.');
            return;
        }
        
        let added = 0;
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim());
            const front = cols[frontIdx] || '';
            const back = cols[backIdx] || '';
            if (!front || !back) continue;
            const tags = tagsIdx !== -1 && cols[tagsIdx] ? 
                cols[tagsIdx].split(';').map(t => t.trim()).filter(t => t) : [];
            let deckName = deckIdx !== -1 && cols[deckIdx] ? cols[deckIdx].trim() : 'Imported';
            
            let deckId = Object.keys(data.decks).find(id => data.decks[id].name === deckName);
            if (!deckId) {
                deckId = generateId();
                data.decks[deckId] = { name: deckName, intervals: [0.0417, 1, 3, 7], cards: [] };
            }
            data.decks[deckId].cards.push({
                id: generateId(),
                front, back,
                tags: tags,
                dueDate: today(),
                step: 0,
                ease: 2.5
            });
            added++;
        }
        saveData();
        renderHome();
        renderSettings();
        showToast(`Imported ${added} cards!`);
    };
    reader.readAsText(file);
    this.value = '';
});

function exportCSV() {
    closeFab();
    const ids = Object.keys(data.decks);
    if (ids.length === 0) {
        showToast('No decks to export.');
        return;
    }
    let csv = 'Front,Back,Tags,Deck\n';
    for (const [id, deck] of Object.entries(data.decks)) {
        deck.cards.forEach(c => {
            const tags = c.tags ? c.tags.join(';') : '';
            csv += `"${c.front}","${c.back}","${tags}","${deck.name}"\n`;
        });
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cjaycards_export.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Export complete!');
}

// ============================================================
// RESET PROGRESS
// ============================================================
function resetProgress() {
    closeFab();
    const ids = Object.keys(data.decks);
    if (ids.length === 0) {
        showToast('No decks to reset.');
        return;
    }
    openModal('resetProgress');
}

function confirmResetProgress() {
    const select = document.getElementById('resetDeckSelect');
    const deckId = select.value;
    if (!deckId || !data.decks[deckId]) return;
    data.decks[deckId].cards.forEach(c => { c.dueDate = today(); });
    saveData();
    closeModal();
    renderHome();
    showToast('Progress reset for ' + data.decks[deckId].name);
}

// ============================================================
// NAVIGATION
// ============================================================
function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById('screen-' + screen).classList.add('active');
    if (screen === 'home') renderHome();
    if (screen === 'settings') renderSettings();
}

function resetAllData() {
    if (!confirm('Delete ALL decks and cards?')) return;
    data = getDefaultData();
    saveData();
    renderHome();
    renderSettings();
    showToast('All data cleared.');
}
