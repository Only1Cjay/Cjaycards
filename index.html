<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CjayCards</title>

    <script>
    (function() {
        try {
            var theme = localStorage.getItem('cjaycards_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>

    <meta name="theme-color" content="#0a1628">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CjayCards">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner">No internet connection</div>
<div class="toast" id="toast"></div>
<div class="update-toast" id="updateToast">
    <span>New version available</span>
    <button id="updateRefreshBtn">Refresh</button>
</div>
<div class="undo-toast" id="undoToast">
    <span id="undoText">Card deleted</span>
    <button id="undoBtn">Undo</button>
</div>

<header class="topbar">
    <button class="brand" id="brandBtn" aria-label="Home">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="14" height="16" rx="2"/>
            <path d="M8 5V3a2 2 0 012-2h8a2 2 0 012 2v14a2 2 0 01-2 2h-2"/>
        </svg>
        <span class="brand-name">Cjay<span>Cards</span></span>
    </button>
    <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
        <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="popup-menu" id="popupMenu">
            <button class="popup-item" data-menu="stats">
                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Stats</span>
            </button>
            <button class="popup-item" data-menu="hardest">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>Hardest cards</span>
            </button>
            <div class="popup-divider"></div>
            <button class="popup-item" data-menu="settings">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
                <span>Settings</span>
            </button>
        </div>
    </div>
</header>

<main class="app-main">

    <!-- HOME -->
    <section id="view-home" class="view active">
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-num" id="statDecks">0</span>
                <span class="stat-label">decks</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="statDue">0</span>
                <span class="stat-label">due today</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="statCards">0</span>
                <span class="stat-label">cards</span>
            </div>
        </div>
        <div id="deckList" class="deck-list"></div>
        <button class="btn btn-primary btn-block" id="newDeckBtn" style="margin-top:16px;">
            <svg class="icon-svg sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New deck
        </button>
    </section>

    <!-- DECK VIEW -->
    <section id="view-deck" class="view">
        <div class="view-toolbar">
            <button class="btn btn-outline btn-sm" id="backFromDeckBtn">
                <svg class="icon-svg sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Decks
            </button>
            <div class="view-toolbar-actions">
                <button class="btn btn-primary btn-sm" id="startStudyBtn">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Study
                </button>
                <button class="icon-btn" id="deckMenuBtn" aria-label="Deck options">
                    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                </button>
                <div class="popup-menu" id="deckMenu">
                    <button class="popup-item" data-deck-action="tag">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                        <span>Study by tag</span>
                    </button>
                    <button class="popup-item" data-deck-action="cram">
                        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        <span>Cram mode</span>
                    </button>
                    <div class="popup-divider"></div>
                    <button class="popup-item" data-deck-action="edit">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        <span>Edit deck</span>
                    </button>
                    <button class="popup-item danger" data-deck-action="delete">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
                        <span>Delete deck</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="deck-header">
            <h2 class="deck-title" id="deckTitle">Deck</h2>
            <p class="deck-meta" id="deckMeta"></p>
        </div>

        <div class="filter-pills" id="cardFilters">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="due">Due</button>
            <button class="filter-pill" data-filter="leeches">Leeches</button>
            <button class="filter-pill" data-filter="buried">Buried</button>
        </div>

        <div id="cardList" class="card-list"></div>

        <button class="btn btn-primary btn-block" id="newCardBtn" style="margin-top:16px;">
            <svg class="icon-svg sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New card
        </button>
    </section>

    <!-- STUDY VIEW -->
    <section id="view-study" class="view">
        <div class="view-toolbar">
            <button class="btn btn-outline btn-sm" id="exitStudyBtn">
                <svg class="icon-svg sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                Exit
            </button>
            <div class="study-progress" id="studyProgress">0 / 0</div>
        </div>
        <div id="studyBody" class="study-body"></div>
    </section>

    <!-- SETTINGS VIEW -->
    <section id="view-settings" class="view">
        <div class="view-toolbar">
            <button class="btn btn-outline btn-sm" id="backFromSettingsBtn">
                <svg class="icon-svg sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back
            </button>
        </div>
        <h2 class="view-title">Settings</h2>

        <div class="settings-group">
            <button class="group-header" data-group="drive">
                <h3>Google Drive backup</h3>
                <span class="toggle-icon">▾</span>
            </button>
            <div class="group-content">
                <p class="group-desc">Manually back up and restore your cards to Google Drive.</p>
                <label>Client ID</label>
                <input type="text" id="driveClientId" placeholder="Paste your Google client ID">
                <div class="btn-row-inline">
                    <button class="btn btn-primary btn-sm" id="connectDriveBtn">Connect</button>
                    <button class="btn btn-outline btn-sm" id="drivePushBtn" disabled>Back up</button>
                    <button class="btn btn-outline btn-sm" id="drivePullBtn" disabled>Restore</button>
                </div>
                <div id="driveStatus" class="status-line"></div>
            </div>
        </div>

        <div class="settings-group">
            <button class="group-header" data-group="backup">
                <h3>Backup &amp; restore</h3>
                <span class="toggle-icon">▾</span>
            </button>
            <div class="group-content">
                <p class="group-desc">Save your data as a JSON file, or import a previous backup.</p>
                <div class="btn-row-inline">
                    <button class="btn btn-outline btn-sm" id="exportBtn">Export</button>
                    <button class="btn btn-outline btn-sm" id="importBtn">Import</button>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <button class="group-header" data-group="about">
                <h3>About</h3>
                <span class="toggle-icon">▾</span>
            </button>
            <div class="group-content">
                <div class="status-line">CjayCards <span id="appVersion">—</span></div>
                <div class="status-line">Made by Only1Cjay</div>
            </div>
        </div>

        <button class="btn btn-danger btn-block" id="resetBtn" style="margin-top:16px;">Reset all data</button>
    </section>

</main>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<input type="file" id="backupInput" class="hidden-input" accept=".json">

<script src="storage.js"></script>
<script src="app.js"></script></body>
</html>
